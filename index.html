<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Obfuscator</title>
<meta name="description" content="Obfuscate a Luau script in your browser. Nothing is uploaded anywhere.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>

<div class="wrap">
  <header>
    <strong>Air Obfuscator</strong>
  </header>

  <h1>Obfuscate a Luau script</h1>
  <p class="lead">Upload a .lua file, or paste code below. Runs in your browser — nothing is uploaded anywhere.</p>

  <div class="panel">
    <label class="drop" id="drop" tabindex="0">
      <input type="file" id="file" accept=".lua,.txt,text/plain" />
      <p class="big">Drop a .lua file here, or click to browse</p>
      <p class="small">Max size 40 MB</p>
    </label>
    <div class="file-info" id="fileInfo" style="display:none;">
      <span id="fileName"></span>
      <button type="button" id="clearFile">Remove</button>
    </div>

    <p class="or">or paste code</p>
    <textarea id="code" placeholder='print("Hello, Luau!")'></textarea>

    <div class="row">
      <button class="primary" id="run">Obfuscate</button>
      <button class="secondary" id="reset" type="button">Clear</button>
    </div>
    <div class="bar" id="bar"><div id="barFill"></div></div>
    <div class="status" id="status"></div>
  </div>

  <div class="panel output" id="outputPanel" style="display:none;">
    <div class="row" style="margin-top:0;">
      <button class="secondary" id="copy">Copy output</button>
      <button class="secondary" id="download">Download .lua</button>
    </div>
    <pre id="output"></pre>
  </div>
</div>

<footer>Air Obfuscator</footer>

<script src="snow.js"></script>
<script src="obfuscate-core.js"></script>
<script src="app.js"></script>
</body>
</html>
